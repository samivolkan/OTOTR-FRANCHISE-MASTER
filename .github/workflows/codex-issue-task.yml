name: OTOTR AI Issue Helper

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: GitHub issue number to prepare
        required: true
      mode:
        description: plan | implement
        required: false
        default: plan

permissions:
  contents: read
  issues: write

jobs:
  issue_helper:
    runs-on: ubuntu-latest
    steps:
      - name: Explain native agent flow
        run: |
          echo "This workflow is intentionally safe-only."
          echo "Use GitHub Agents / Codex from the Agents tab or mention @codex on an issue."
          echo "No automatic code changes, branch creation, or merge happens here."
