name: OTOTR AI PR Helper

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review manually
        required: true

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  pr_helper:
    runs-on: ubuntu-latest
    steps:
      - name: Explain native agent flow
        run: |
          echo "This workflow is intentionally safe-only."
          echo "Use GitHub Agents / Codex from the Agents tab or mention @codex on a pull request."
          echo "No automatic code changes, review approvals, or merge happens here."
