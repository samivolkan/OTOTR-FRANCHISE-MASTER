<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OTOTR Bayi Portalı</title>
  <link rel="icon" type="image/svg+xml" href="../docs/ototr-favicon.svg">
  <style>
    :root {
      --bg: #f4f6f8;
      --panel: #ffffff;
      --panel-2: #f9fafb;
      --ink: #14181f;
      --muted: #667085;
      --line: #d9dee7;
      --brand: #c9161d;
      --brand-2: #8f1117;
      --good: #12715b;
      --warn: #ad6a00;
      --bad: #b42318;
      --info: #185c99;
      --radius: 8px;
      --shadow: 0 16px 38px rgba(20, 24, 31, .08);
      --sidebar: 268px;
      --topbar: 76px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif; }
    body { overflow-x: hidden; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .app { min-height: 100vh; display: grid; grid-template-columns: var(--sidebar) 1fr; }
    .sidebar { position: sticky; top: 0; height: 100vh; background: #11151b; color: #f7f7f8; display: flex; flex-direction: column; border-right: 1px solid #252b35; }
    .brand { height: var(--topbar); display: flex; align-items: center; gap: 12px; padding: 0 18px; border-bottom: 1px solid #252b35; }
    .brand-mark { width: 38px; height: 38px; border-radius: 7px; background: var(--brand); display: grid; place-items: center; font-weight: 900; letter-spacing: 0; }
    .brand strong { display: block; font-size: 15px; line-height: 1.1; }
    .brand span { display: block; color: #aeb6c2; font-size: 12px; margin-top: 3px; }
    .scope { padding: 16px 18px; border-bottom: 1px solid #252b35; }
    .scope label { color: #aeb6c2; font-size: 12px; display: block; margin-bottom: 7px; }
    .scope select { width: 100%; background: #191f28; color: #fff; border: 1px solid #303846; border-radius: 7px; padding: 10px 11px; outline: none; }
    .nav { padding: 10px; overflow: auto; }
    .nav button { width: 100%; border: 0; background: transparent; color: #d7dde6; display: grid; grid-template-columns: 28px 1fr auto; align-items: center; gap: 8px; padding: 10px 9px; border-radius: 7px; text-align: left; margin: 2px 0; }
    .nav button:hover { background: #1a2029; color: #fff; }
    .nav button.active { background: #f4f6f8; color: #11151b; }
    .nav .ico { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; background: rgba(255,255,255,.08); font-size: 13px; font-weight: 800; }
    .nav button.active .ico { background: #e3e7ed; color: var(--brand); }
    .nav .count { color: inherit; font-size: 11px; padding: 2px 6px; background: rgba(255,255,255,.08); border-radius: 999px; }
    .nav-separator { color: #7f8997; font-size: 10px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; padding: 14px 8px 5px; }
    .main { min-width: 0; }
    .topbar { position: sticky; top: 0; z-index: 5; min-height: var(--topbar); display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 24px; background: rgba(244,246,248,.93); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
    .title h1 { margin: 0; font-size: 22px; line-height: 1.2; letter-spacing: 0; }
    .title p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
    .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
    .btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 7px; padding: 9px 12px; min-height: 38px; display: inline-flex; align-items: center; gap: 8px; font-weight: 700; }
    .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
    .btn.dark { background: #151a21; border-color: #151a21; color: #fff; }
    .btn.icon { width: 38px; padding: 0; justify-content: center; }
    .content { padding: 22px 24px 36px; }
    .screen { display: none; }
    .screen.active { display: block; }
    .grid { display: grid; gap: 14px; }
    .grid.kpi { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .grid.two { grid-template-columns: minmax(0, 1.3fr) minmax(320px, .7fr); }
    .grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow-x: auto; }
    .panel.pad { padding: 16px; }
    .panel-head { display: flex; justify-content: space-between; gap: 14px; align-items: center; padding: 15px 16px; border-bottom: 1px solid var(--line); }
    .panel-head h2 { margin: 0; font-size: 15px; letter-spacing: 0; }
    .panel-head p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
    .metric { padding: 15px; min-height: 124px; display: flex; flex-direction: column; justify-content: space-between; }
    .metric small { color: var(--muted); font-weight: 700; }
    .metric strong { display: block; font-size: 27px; margin-top: 8px; letter-spacing: 0; }
    .metric .delta { margin-top: 12px; color: var(--muted); font-size: 12px; }
    .delta.good, .tone.good { color: var(--good); }
    .delta.warn, .tone.warn { color: var(--warn); }
    .delta.bad, .tone.bad { color: var(--bad); }
    .delta.info, .tone.info { color: var(--info); }
    .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .filters input, .filters select { border: 1px solid var(--line); background: #fff; border-radius: 7px; min-height: 38px; padding: 8px 10px; min-width: 160px; }
    table { width: 100%; min-width: 680px; border-collapse: collapse; }
    th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid #edf0f4; vertical-align: middle; font-size: 13px; }
    th { color: #475467; font-size: 12px; background: #fafbfc; }
    tr:last-child td { border-bottom: 0; }
    .plate { display: inline-flex; align-items: center; height: 27px; border: 2px solid #111827; border-radius: 5px; padding: 0 9px; background: #fff; font-weight: 900; white-space: nowrap; }
    .badge { display: inline-flex; align-items: center; border-radius: 999px; padding: 4px 8px; font-size: 12px; font-weight: 800; border: 1px solid transparent; white-space: nowrap; }
    .badge.good { color: var(--good); background: #e9f7f3; border-color: #c3e8dd; }
    .badge.warn { color: var(--warn); background: #fff4df; border-color: #ffdca3; }
    .badge.bad { color: var(--bad); background: #feeceb; border-color: #fac5c0; }
    .badge.info { color: var(--info); background: #e8f2fc; border-color: #c5def6; }
    .timeline { display: grid; gap: 10px; padding: 16px; }
    .step { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: start; padding-bottom: 10px; border-bottom: 1px solid #edf0f4; }
    .step:last-child { border-bottom: 0; padding-bottom: 0; }
    .dot { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 12px; font-weight: 900; background: var(--muted); }
    .dot.good { background: var(--good); }
    .dot.warn { background: var(--warn); }
    .dot.bad { background: var(--bad); }
    .step strong { display: block; font-size: 13px; }
    .step span { display: block; color: var(--muted); font-size: 12px; margin-top: 3px; }
    .board { display: grid; grid-template-columns: repeat(4, minmax(220px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 4px; }
    .lane { background: #eef1f5; border: 1px solid var(--line); border-radius: var(--radius); min-height: 280px; }
    .lane h3 { margin: 0; padding: 12px; font-size: 13px; display: flex; justify-content: space-between; }
    .ticket { margin: 0 10px 10px; padding: 12px; background: #fff; border: 1px solid var(--line); border-radius: 7px; }
    .ticket strong { display: block; font-size: 13px; }
    .ticket p { margin: 6px 0 10px; color: var(--muted); font-size: 12px; line-height: 1.35; }
    .progress { height: 8px; background: #e6eaf0; border-radius: 999px; overflow: hidden; }
    .progress span { display: block; height: 100%; background: var(--brand); border-radius: 999px; }
    .split-list { display: grid; gap: 10px; padding: 16px; }
    .list-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 12px; border: 1px solid var(--line); border-radius: 7px; background: #fff; }
    .list-row strong { display: block; font-size: 13px; }
    .list-row span { display: block; color: var(--muted); font-size: 12px; margin-top: 3px; }
    .form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 16px; }
    .field label { display: block; color: #475467; font-size: 12px; font-weight: 800; margin-bottom: 6px; }
    .field input, .field select, .field textarea { width: 100%; border: 1px solid var(--line); background: #fff; border-radius: 7px; padding: 10px 11px; min-height: 40px; outline: none; }
    .field textarea { min-height: 92px; resize: vertical; }
    .field.full { grid-column: 1 / -1; }
    .role-strip { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin-bottom: 14px; }
    .role-card { border: 1px solid var(--line); border-radius: 7px; background: #fff; padding: 11px; text-align: left; }
    .role-card.active { border-color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); }
    .role-card strong { display: block; font-size: 13px; }
    .role-card span { color: var(--muted); font-size: 12px; display: block; margin-top: 4px; }
    .mobile-menu { display: none; }

    @media (max-width: 1180px) {
      .grid.kpi { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid.two, .grid.three { grid-template-columns: 1fr; }
      .role-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 760px) {
      :root { --topbar: auto; }
      .app { grid-template-columns: 1fr; }
      .sidebar { position: fixed; z-index: 20; inset: 0 auto 0 0; width: 286px; transform: translateX(-105%); transition: transform .18s ease; }
      .sidebar.open { transform: translateX(0); }
      .mobile-menu { display: inline-flex; }
      .topbar { display: grid; grid-template-columns: 38px minmax(0, 1fr); align-items: start; padding: 14px; }
      .title { min-width: 0; }
      .title h1 { font-size: 21px; }
      .title p { max-width: 100%; }
      .actions { grid-column: 1 / -1; padding-left: 52px; }
      .content { padding: 14px; }
      .grid.kpi { grid-template-columns: 1fr; }
      .actions { width: 100%; justify-content: flex-start; }
      .form { grid-template-columns: 1fr; }
      .role-strip { grid-template-columns: 1fr; }
      th, td { padding: 10px; }
      .panel { box-shadow: none; }
      table { min-width: 620px; }
    }
  </style>
</head>

    function renderSettings() {
      screen("settings").innerHTML = `
        <div class="grid two">
          <div class="panel pad"><h2 style="font-size:15px;margin:0 0 12px">Şube politikaları</h2>${lockList(["Ödeme tamamlanmadan rapor teslim edilmez","Bayi sahibi teknik sonucu değiştiremez","Kritik cihaz kalibrasyonu geçerse ilgili paket kilitlenir","İtiraz P1/P0 ise merkeze eskale edilir"])}</div>

    function field(label, type, value) {
      return `<div class="field"><label>${label}</label><input type="${type}" value="${escapeHtml(value)}"></div>`;
    }

    function selectField(label, options) {
      return `<div class="field"><label>${label}</label><select>${options.map(o => `<option>${o}</option>`).join("")}</select></div>`;
    }

    function lockList(items) {
      return `<div class="split-list" style="padding:0">${items.map((item, i) => `<div class="list-row"><div><strong>${item}</strong><span>${i % 2 ? "Rol ve şube kapsamı ile denetlenir." : "Canlı sistemde audit log bırakır."}</span></div><span class="badge ${i === 0 ? "bad" : "warn"}">Kilit</span></div>`).join("")}</div>`;
    }

    function roleHint(key) {
      return {
        owner: "Para, kalite, risk ve personel",
        manager: "Operasyon, onay ve kapasite",
        reception: "Randevu, kabul ve teslim",
        technician: "Kendi görevleri ve kanıt",
        cashier: "Tahsilat ve gün sonu"
      }[key];
    }

    function roleMetrics() {
      const map = {
        owner: state.kpis,
        manager: [["Açık iş emri","18","4 gecikmiş","warn"],["Usta kuyruğu","9","2 eksik kanıt","bad"],["Onay bekleyen","4","Bugün kapanmalı","warn"],["Kapasite","%86","Yoğun","info"]],
        reception: [["Randevu","12","3 teyit bekliyor","warn"],["İş emri taslağı","5","KVKK kontrol","info"],["Basım kuyruğu","6","2 ödeme bekler","warn"],["Teslim","9","QR hazır","good"]],
        technician: [["Bana atanan","6","2 kritik","warn"],["Aktif araç","34 KDY 528","Kaporta hattı","info"],["Eksik kanıt","2","Fotoğraf gerekli","bad"],["Tamamlanan","11","Bugün","good"]],
        cashier: [["Tahsilat","₺286.400","POS %61","good"],["Açık ödeme","₺42.000","2 rapor kilitli","warn"],["Fatura","19","3 bekliyor","info"],["Kasa kapanış","%82","Saat 18:00","warn"]]
      };
      return map[state.role] || state.kpis;
    }

    function renderNav() {
      const nav = document.getElementById("nav");
      const visible = state.routes.filter(route => route[4].includes(state.role));
      if (!visible.some(route => route[0] === state.route)) state.route = visible[0][0];
      const commerceStart = new Set(["listings"]);
      const managementStart = new Set(["staff"]);
      let lastGroup = "";
      nav.innerHTML = visible.map(([id, title, ico, subtitle, roles, count]) => {
        const group = commerceStart.has(id) ? "Ticari Self-Servis" : managementStart.has(id) ? "Yönetim" : lastGroup || "Operasyon";
        const label = group !== lastGroup ? `<div class="nav-separator">${group}</div>` : "";
        lastGroup = group;
        return `${label}<button class="${state.route === id ? "active" : ""}" data-route="${id}" title="${subtitle}">
          <span class="ico">${ico}</span><span>${title}</span><span class="count">${count}</span>
        </button>`;
      }).join("");
    }

    function renderAll() {
      renderDashboard();
      renderAppointments();
      renderWorkOrders();
      renderTechnician();
      renderApprovals();
      renderReports();
      renderDelivery();
      renderCustomers();
      renderListings();
      renderOffers();
      renderOrders();
      renderPayments();
      renderInvoices();
      renderShipments();
      renderWarranty();
      renderDocuments();
      renderAnalytics();
      renderStaff();
      renderAcademy();
      renderFinance();
      renderAssets();
      renderQuality();
      renderSupport();
      renderSettings();
      renderNav();
      setRoute(state.route);
    }

    function setRoute(route) {
      state.route = route;
      document.querySelectorAll(".screen").forEach(el => el.classList.remove("active"));
      screen(route).classList.add("active");
      document.querySelectorAll("[data-route]").forEach(btn => btn.classList.toggle("active", btn.dataset.route === route));
      const [title, subtitle] = titleMap[route] || titleMap.dashboard;
      document.getElementById("pageTitle").textContent = title;
      document.getElementById("pageSubtitle").textContent = subtitle;
      document.getElementById("sidebar").classList.remove("open");
    }

    document.addEventListener("click", event => {
      const route = event.target.closest("[data-route]")?.dataset.route;
      if (route) setRoute(route);
      const role = event.target.closest("[data-role-card]")?.dataset.roleCard;
      if (role) {
        state.role = role;
        document.getElementById("roleSelect").value = role;
        renderAll();
      }
    });

    document.getElementById("roleSelect").addEventListener("change", event => {
      state.role = event.target.value;
      renderAll();
    });
    document.getElementById("menuButton").addEventListener("click", () => document.getElementById("sidebar").classList.add("open"));

    renderAll();
  </script>
</body>
