# Local-only Supabase config for OTOTR.
# Replay worktree configuration validated against pinned Supabase CLI 3.0.0.
# Local stack startup still requires an approved Docker-compatible runtime.

project_id = "ototr-local"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public", "finance_api"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 17

[studio]
enabled = true
port = 55323

[local_smtp]
enabled = true
port = 55324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

[functions.public-api]
verify_jwt = false

[functions.finance-read]
verify_jwt = true

[functions.finance-command]
verify_jwt = true

[functions.finance-refund-worker]
# Internal endpoint verifies the complete service-role secret itself.
verify_jwt = false

[functions.finance-customer-revenue-worker]
verify_jwt = false

[functions.finance-payment-ingestion-worker]
verify_jwt = false

[functions.finance-service-usage-worker]
verify_jwt = false

[functions.finance-invoice-callback-worker]
verify_jwt = false

[functions.finance-accounting-export-worker]
verify_jwt = false

[functions.finance-branch-access]
verify_jwt = false

[functions.finance-payment-callback-worker]
verify_jwt = false

[functions.finance-payment-checkout]
# Trusted ERP/BFF gateway token is verified by the handler.
verify_jwt = false

[analytics]
enabled = true
port = 55327
backend = "postgres"

# Use the Supabase CLI 3 schema diff engine explicitly for deterministic replay work.
[experimental.pgdelta]
enabled = true
