# Local-only Supabase config for OTOTR.
# This file was hand-authored because Supabase CLI is not installed on this machine.
# After installing the CLI, validate with `supabase start` and update only if the CLI requires it.

project_id = "ototr-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

[functions.public-api]
verify_jwt = false
